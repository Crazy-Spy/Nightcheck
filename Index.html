<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onde a Cris vai passar a noite?</title>
    <link rel="icon" type="image/png" href="https://crazy-spy.github.io/Nightcheck/pin.png">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Onde a Cris vai passar a noite?</h1>
    </header>
    <main>
        <div id="result"></div>
        <div class="date-container">
            <label for="datePicker" class="date-label">Escolha a data:</label>
            <input type="date" id="datePicker" onchange="checkDate()" class="date-picker">
        </div>
        <div class="nav-buttons">
            <button onclick="navigateDate(-10)">-10</button>
            <button onclick="navigateDate(-1)">-1</button>
            <button onclick="navigateToday()">HOJE</button>
            <button onclick="navigateDate(1)">+1</button>
            <button onclick="navigateDate(10)">+10</button>
        </div>
        <div id="selectedDateValue"></div>
    </main>
    <footer>
        <p>&copy; 2025 Cris. Todos os direitos reservados.</p>
    </footer>
    <script>
        function isNoiteFora(date) {
            // A data de referência é 2024-09-01 para "Casa" (par)
            // Se diffDays for 0 (01/09/2024), então 0 % 2 é 0, que é par (casa).
            // Se diffDays for 1 (02/09/2024), então 1 % 2 é 1, que é ímpar (fora).
            const startDate = new Date('2024-09-01');
            startDate.setHours(0, 0, 0, 0); // Zera horas para comparação precisa
            date.setHours(0, 0, 0, 0); // Zera horas da data selecionada

            const diffTime = date.getTime() - startDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays % 2 !== 0; // true para ímpar (fora), false para par (casa)
        }

        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = date.toLocaleDateString('pt-BR', options);
            return formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
        }

        function addOneDay(date) {
            const newDate = new Date(date);
            newDate.setDate(newDate.getDate() + 1);
            return newDate;
        }

        function updateResult(date, isToday = false) {
            const result = document.getElementById('result');
            const resultText = isNoiteFora(date);
            let message = "";
            let className = "";

            if (isToday) {
                if (resultText) {
                    message = `Hoje é noite de dormir fora. Em casa até as 19h30.`;
                    className = 'fora';
                } else {
                    message = `Hoje é noite de dormir em casa. Chegará em casa 17h.`;
                    className = 'casa';
                }
            } else {
                const nextDayForDisplay = new Date(date);
                nextDayForDisplay.setDate(nextDayForDisplay.getDate() + 1); // Display the next day, as logic implies
                const formattedDate = formatDate(nextDayForDisplay);
                if (resultText) {
                    message = `${formattedDate} é noite de dormir fora. Em casa até as 19h30.`;
                    className = 'fora';
                } else {
                    message = `${formattedDate} é noite de dormir em casa. Chegará em casa 17h`;
                    className = 'casa';
                }
            }
            result.textContent = message;
            result.className = className;
        }


        function checkDate() {
            const datePicker = document.getElementById('datePicker');
            const selectedDate = new Date(datePicker.value);

            if (isNaN(selectedDate.getTime())) { // Melhor verificação de data inválida
                const result = document.getElementById('result');
                result.textContent = 'Por favor, selecione uma data válida.';
                result.className = '';
                return;
            }
            updateResult(selectedDate, false);
        }

        function navigateDate(days) {
            const datePicker = document.getElementById('datePicker');
            let selectedDate;

            // Se nada foi selecionado, começa de hoje
            if (!datePicker.value) {
                selectedDate = new Date();
            } else {
                selectedDate = new Date(datePicker.value);
            }

            selectedDate.setDate(selectedDate.getDate() + days);
            datePicker.value = selectedDate.toISOString().split('T')[0];
            checkDate();
        }

        function navigateToday() {
            const datePicker = document.getElementById('datePicker');
            const today = new Date();
            datePicker.value = today.toISOString().split('T')[0];
            updateResult(today, true); // Atualiza com a lógica de "hoje"
        }

        // Inicializa com a data de hoje e atualiza o resultado
        document.addEventListener('DOMContentLoaded', () => {
            navigateToday();
        });
    </script>
</body>
</html>
